[package]
name = "pulsar_dsp"
version = "0.0.1"
edition = "2024"
rust-version = "1.94"
authors = ["Simon <perso@simontuloup.fr>"]
license = "GPL-3.0-or-later"
description = "Audio processing firmware for the STM32H743 board"
publish = false

[[bin]]
name = "pulsar_dsp"
test = false
bench = false

[dependencies]
cortex-m ={ version = "0.7.9", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.6"
pulsar_lib = { version = "0.0.1", path = "../pulsar_lib" }
stm32h7 = { version = "0.16.0", features = ["stm32h743v", "rt"] }

[profile.release]
codegen-units = 1
debug = true
lto = "fat"
opt-level = 3
overflow-checks = true

[profile.dev]
opt-level = 1

[lints.rust]
missing_docs = "deny"
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
panic_in_result_fn = "deny"
