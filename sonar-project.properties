# SonarQube configuration for the Pulsar firmware.
# The CI produces the referenced reports at the repository root
# (see .github/workflows/ci.yml and scripts/ci-local.sh).

sonar.projectKey=Pulsar
sonar.projectName=Pulsar Firmware
sonar.sourceEncoding=UTF-8

sonar.sources=pulsar_lib/src,pulsar_dsp/src,pulsar_ctrl/src
sonar.exclusions=**/target/**,**/.embuild/**

sonar.language=rust
sonar.rust.lcov.reportPaths=lcov.info
sonar.rust.clippy.reportPaths=clippy-report.json
sonar.sarifReportPaths=cargo-deny-pulsar_lib.sarif,cargo-deny-pulsar_dsp.sarif,cargo-deny-pulsar_ctrl.sarif
